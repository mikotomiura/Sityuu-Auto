[project]
name = "fortune-mentoring-system"
version = "0.1.0"
description = "占い・メンタリング支援ローカルシステム"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "lunar-python>=1.3",
    "openai>=1.0",
    "anthropic>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "google-genai>=1.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["lunar_python", "lunar_python.*", "google", "google.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
